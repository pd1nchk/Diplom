#Kotlin
kotlin.code.style=official
# K/JS + Compose: первая компиляция тяжёлая; при «тишине» на 93% смотрите CPU у java/kotlin-daemon в диспетчере задач.
kotlin.daemon.jvmargs=-Xmx5120M -XX:+UseG1GC

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Клиент Android: если в local.properties задан diplom.server.host — он попадает в BuildConfig.
# Если строки нет, при сборке подставляется авто-IPv4 этой машины (Wi‑Fi); эмулятор в рантайме всё равно ходит на 10.0.2.2.
# diplom.server.host=192.168.1.50