ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
  }

  application {
    modules = [ com.example.diplom.ApplicationKt.module ]
  }
}

database {
  # По умолчанию — встроенная H2 (файл ./data/diplom), без установки PostgreSQL.
  # Для PostgreSQL задайте DB_JDBC_URL, DB_USER, DB_PASSWORD.
  # AUTO_SERVER=TRUE — повторный запуск подключается к уже открытой H2, а не падает с file locked
  jdbcUrl = "jdbc:h2:file:./data/diplom;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000"
  user = "sa"
  password = ""

  jdbcUrl = ${?DB_JDBC_URL}
  user = ${?DB_USER}
  password = ${?DB_PASSWORD}
}

jwt {
  secret = ${?JWT_SECRET}
  issuer = "diplom-server"
  audience = "diplom-clients"
  realm = "diplom"
}

